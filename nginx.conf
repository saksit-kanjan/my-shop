# The shop's front door: one address for the three web apps and the API.
#   /          POS (cashier)
#   /display/  customer display
#   /admin/    back office
#   /api/      the server (NestJS), proxied
# The POS and the customer display must share this one origin: the display follows the POS through a BroadcastChannel.
server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  location /api/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 60s;
  }

  # Built files carry a content hash in their name, so they can be cached for a long time.
  location ~* /assets/.+\.(js|css|woff2?|svg|png|jpg|ico)$ {
    try_files $uri =404;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # Single-page apps: any path that is not a file gets the app's index.html. Never cache index.html.
  location /display/ {
    try_files $uri /display/index.html;
    add_header Cache-Control "no-cache";
  }

  location /admin/ {
    try_files $uri /admin/index.html;
    add_header Cache-Control "no-cache";
  }

  location / {
    try_files $uri /index.html;
    add_header Cache-Control "no-cache";
  }
}
