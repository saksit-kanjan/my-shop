<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
[data-theme=myshop]{color-scheme:light;--color-base-100:#ffffff;--color-base-200:#f4f5f2;--color-base-300:#e3e6e0;--color-base-content:#18201c;--color-primary:#0e6b58;--color-primary-content:#ffffff;--color-secondary:#e3f1ec;--color-secondary-content:#0a4a3d;--color-accent:#e3f1ec;--color-accent-content:#0a4a3d;--color-neutral:#18201c;--color-neutral-content:#ffffff;--color-info:#1d4ed8;--color-info-content:#ffffff;--color-success:#0e6b58;--color-success-content:#ffffff;--color-warning:#b54708;--color-warning-content:#ffffff;--color-error:#b42318;--color-error-content:#ffffff;--radius-selector:2rem;--radius-field:.75rem;--radius-box:1rem;--size-selector:.25rem;--size-field:.25rem;--border:1px;--depth:0;--noise:0}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
.anim-in{animation:fadeUp .4s ease-out both}
.anim-in-2{animation:fadeUp .4s .08s ease-out both}
.anim-in-3{animation:fadeUp .4s .16s ease-out both}
.anim-pop{animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
.check-path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .45s .3s ease-out forwards}
.lift{transition:transform .15s ease,box-shadow .15s ease}.lift:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(24,32,28,.08)}.lift:active{transform:scale(.97)}
.pimg{background-image:url(/_blob/22db5b6938a5782c73ea28ae89ef9012);background-size:400% 300%;background-repeat:no-repeat}
.p-water{background-position:0% 0%}.p-coffee{background-position:33.333% 0%}.p-tea{background-position:66.667% 0%}.p-milk{background-position:100% 0%}
.p-bread{background-position:0% 50%}.p-chips{background-position:33.333% 50%}.p-biscuit{background-position:66.667% 50%}.p-soap{background-position:100% 50%}
.p-paste{background-position:0% 100%}.p-tissue{background-position:33.333% 100%}.p-pen{background-position:66.667% 100%}.p-battery{background-position:100% 100%}
@keyframes slideIn{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(14,107,88,0)}50%{box-shadow:0 0 0 6px rgba(14,107,88,.15)}}
@keyframes drift{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.02)}}
.anim-slide{animation:slideIn .45s ease-out both}.anim-glow{animation:glow 2s ease-in-out infinite}
.anim-drift{animation:drift 40s linear infinite}.anim-breathe{animation:breathe 4s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.anim-slide,.anim-glow,.anim-drift,.anim-breathe{animation:none}.anim-in,.anim-in-2,.anim-in-3,.anim-pop{animation:none}.check-path{animation:none;stroke-dashoffset:0}.lift{transition:none}}
</style>
</helmet>
<div data-theme="myshop" class="min-h-[800px] flex flex-col bg-base-200 text-base-content" style="font-family: 'IBM Plex Sans Thai', 'IBM Plex Sans', sans-serif; font-variant-numeric: tabular-nums">
<header class="flex items-center justify-between px-8 py-5">
<span class="text-2xl font-semibold">My Shop</span>
<span class="text-lg opacity-70">สาขา [ชื่อสาขา]</span>
</header>
<main class="flex-1 flex flex-col items-center justify-center gap-6 px-8 pb-10 text-center">
<svg width="140" height="140" viewBox="0 0 48 48" class="anim-pop" role="img" aria-label="ชำระเงินสำเร็จ"><circle cx="24" cy="24" r="22" fill="#e3f1ec"></circle><path class="check-path" d="M14 24.5l7 7 13-14" fill="none" stroke="#0e6b58" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path></svg>
<h1 class="text-6xl font-semibold m-0 anim-in">ขอบคุณที่อุดหนุน</h1>
<div class="flex flex-wrap justify-center gap-4 anim-in-2">
<div class="rounded-box bg-base-100 border border-base-300 px-10 py-6 flex flex-col">
<span class="text-xl opacity-70">เงินทอน</span><span class="text-6xl font-semibold">฿70.00</span>
</div>
<div class="rounded-box bg-secondary text-secondary-content px-10 py-6 flex flex-col">
<span class="text-xl">วันนี้คุณประหยัด</span><span class="text-6xl font-semibold">฿6.00</span>
</div>
</div>
<span class="text-2xl opacity-70 anim-in-3">สมัครสมาชิกครั้งหน้า สะสมแต้มจากทุกบิล</span>
</main>
</div>
