<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>เงินเข้าออก</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/37d9b3ad37cec22200d6cae5a6c509c8">
<script src="/_blob/dc764973e8003d6d5b097b4eb3f523fd"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
[data-theme=myshop]{color-scheme:light;--color-base-100:#ffffff;--color-base-200:#f4f5f2;--color-base-300:#e3e6e0;--color-base-content:#18201c;--color-primary:#0e6b58;--color-primary-content:#ffffff;--color-secondary:#e3f1ec;--color-secondary-content:#0a4a3d;--color-accent:#e3f1ec;--color-accent-content:#0a4a3d;--color-neutral:#18201c;--color-neutral-content:#ffffff;--color-info:#1d4ed8;--color-info-content:#ffffff;--color-success:#0e6b58;--color-success-content:#ffffff;--color-warning:#b54708;--color-warning-content:#ffffff;--color-error:#b42318;--color-error-content:#ffffff;--radius-selector:2rem;--radius-field:.75rem;--radius-box:1rem;--size-selector:.25rem;--size-field:.25rem;--border:1px;--depth:0;--noise:0}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
.anim-in{animation:fadeUp .4s ease-out both}
.anim-in-2{animation:fadeUp .4s .08s ease-out both}
.anim-in-3{animation:fadeUp .4s .16s ease-out both}
.anim-pop{animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
.check-path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .45s .3s ease-out forwards}
.lift{transition:transform .15s ease,box-shadow .15s ease}.lift:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(24,32,28,.08)}.lift:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){.anim-in,.anim-in-2,.anim-in-3,.anim-pop{animation:none}.check-path{animation:none;stroke-dashoffset:0}.lift{transition:none}}
</style>
</helmet>
<div data-theme="myshop" class="min-h-[800px] flex flex-col bg-base-200 text-base-content" style="font-family: 'IBM Plex Sans Thai', 'IBM Plex Sans', sans-serif; font-variant-numeric: tabular-nums">
<header class="navbar min-h-0 bg-base-100 border-b border-base-300 px-4 py-2 gap-2 flex-wrap">
<div class="flex-1 flex items-center gap-3 flex-wrap">
<a href="Sale.dc.html" class="text-lg font-semibold no-underline text-base-content">My Shop</a>
<span class="badge badge-ghost">T01</span>
<span class="badge badge-soft badge-success gap-1"><span class="w-2 h-2 rounded-full bg-primary"></span>กะเปิด 08:00</span>
</div>
<nav aria-label="เมนู POS" class="flex flex-wrap items-center gap-1">
<a href="Sale.dc.html" class="btn btn-ghost">หน้าขาย</a>
<a href="Held.dc.html" class="btn btn-ghost">บิลที่พัก <span class="badge badge-sm badge-primary">2</span></a>
<a href="Refund.dc.html" class="btn btn-ghost">คืนสินค้า</a>
<a href="CashMove.dc.html" class="btn btn-ghost">เงินเข้า/ออก</a>
<a href="CloseShift.dc.html" class="btn btn-ghost">ปิดกะ</a>
<span class="flex items-center gap-2 pl-2 ml-1 border-l border-base-300"><span class="bg-neutral text-neutral-content w-9 h-9 rounded-full grid place-items-center text-sm">สช</span><span class="text-sm">สมชาย</span></span>
</nav>
</header>
<main class="flex-1 flex flex-wrap gap-4 p-4 items-start">

<section class="card bg-base-100 border border-base-300 anim-in" style="flex: 1 1 420px; max-width: 520px; min-width: 0">
<div class="card-body gap-4">
<h1 class="text-xl font-semibold m-0">บันทึกเงินเข้าออกลิ้นชัก</h1>
<div role="radiogroup" aria-label="ประเภท" class="grid grid-cols-3 gap-2">
<sc-for list="{{types}}" as="t" hint-placeholder-count="3">
<button type="button" role="radio" aria-checked="{{t.on}}" onClick="{{t.pick}}" class="{{t.cls}}">
<span class="font-semibold">{{t.label}}</span>
<span class="text-xs opacity-70 font-normal">{{t.hint}}</span>
</button>
</sc-for>
</div>
<label class="flex flex-col gap-1">
<span class="text-sm">จำนวนเงิน</span>
<input type="text" value="฿0.00" class="input input-lg w-full h-16 text-right text-3xl font-semibold">
</label>
<label class="flex flex-col gap-1">
<span class="text-sm">เหตุผล</span>
<select class="select w-full">
<sc-for list="{{reasons}}" as="r" hint-placeholder-count="3"><option>{{r.label}}</option></sc-for>
</select>
</label>
<label class="flex flex-col gap-1"><span class="text-sm">หมายเหตุ (ไม่บังคับ)</span><input type="text" class="input w-full"></label>
<button type="button" class="btn btn-primary btn-lg h-14">บันทึก</button>
</div>
</section>

<section class="card bg-base-100 border border-base-300 anim-in-2" style="flex: 999 1 460px; min-width: 0">
<div class="card-body gap-3">
<h2 class="text-lg font-semibold m-0">รายการในกะนี้</h2>
<div class="overflow-x-auto">
<table class="table">
<thead><tr><th>เวลา</th><th>ประเภท</th><th>เหตุผล</th><th>ผู้ทำ</th><th class="text-right">จำนวน</th></tr></thead>
<tbody>
<tr><td>11:00</td><td><span class="badge badge-ghost">นำเงินออก</span></td><td>ย้ายเข้าตู้เซฟ</td><td>สมชาย</td><td class="text-right font-semibold">−฿5,000.00</td></tr>
<tr><td>09:15</td><td><span class="badge badge-ghost">จ่ายเงินออก</span></td><td>ค่าน้ำแข็ง</td><td>สมชาย</td><td class="text-right font-semibold">−฿120.00</td></tr>
</tbody>
</table>
</div>
</div>
</section>

</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { type: 'drop' }; }
  renderVals() {
    var self = this, cur = this.state.type;
    var defs = [['drop', 'นำเงินออก', 'เข้าตู้เซฟ'], ['out', 'จ่ายเงินออก', 'ค่าใช้จ่ายร้าน'], ['in', 'นำเงินเข้า', 'เติมเงินทอน']];
    var reasons = { drop: ['ย้ายเข้าตู้เซฟ', 'ส่งเงินให้ผู้จัดการ'], out: ['ค่าน้ำแข็ง', 'ค่าส่งของ', 'ซื้อของใช้ในร้าน', 'อื่น ๆ'], 'in': ['เติมเงินทอน', 'อื่น ๆ'] };
    return {
      types: defs.map(function (d) {
        var on = d[0] === cur;
        return { label: d[1], hint: d[2], on: String(on), pick: function () { self.setState({ type: d[0] }); },
          cls: on ? 'btn h-auto py-3 flex-col gap-0 border-2 border-primary bg-secondary text-secondary-content' : 'btn btn-outline h-auto py-3 flex-col gap-0 border-base-300' };
      }),
      reasons: reasons[cur].map(function (r) { return { label: r }; })
    };
  }
}
</script>
</body>
</html>
