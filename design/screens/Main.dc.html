<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<title>เข้าสู่ระบบ POS</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="/_blob/37d9b3ad37cec22200d6cae5a6c509c8">
<script src="/_blob/dc764973e8003d6d5b097b4eb3f523fd"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
[data-theme=myshop]{color-scheme:light;--color-base-100:#ffffff;--color-base-200:#f4f5f2;--color-base-300:#e3e6e0;--color-base-content:#18201c;--color-primary:#0e6b58;--color-primary-content:#ffffff;--color-secondary:#e3f1ec;--color-secondary-content:#0a4a3d;--color-accent:#e3f1ec;--color-accent-content:#0a4a3d;--color-neutral:#18201c;--color-neutral-content:#ffffff;--color-info:#1d4ed8;--color-info-content:#ffffff;--color-success:#0e6b58;--color-success-content:#ffffff;--color-warning:#b54708;--color-warning-content:#ffffff;--color-error:#b42318;--color-error-content:#ffffff;--radius-selector:2rem;--radius-field:.75rem;--radius-box:1rem;--size-selector:.25rem;--size-field:.25rem;--border:1px;--depth:0;--noise:0}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes pop{0%{opacity:0;transform:scale(.6)}60%{opacity:1;transform:scale(1.06)}100%{transform:scale(1)}}
@keyframes draw{to{stroke-dashoffset:0}}
.anim-in{animation:fadeUp .4s ease-out both}
.anim-in-2{animation:fadeUp .4s .08s ease-out both}
.anim-in-3{animation:fadeUp .4s .16s ease-out both}
.anim-pop{animation:pop .5s cubic-bezier(.2,.8,.2,1) both}
.check-path{stroke-dasharray:40;stroke-dashoffset:40;animation:draw .45s .3s ease-out forwards}
.lift{transition:transform .15s ease,box-shadow .15s ease}.lift:hover{transform:translateY(-2px);box-shadow:0 6px 16px rgba(24,32,28,.08)}.lift:active{transform:scale(.97)}
@media (prefers-reduced-motion:reduce){.anim-in,.anim-in-2,.anim-in-3,.anim-pop{animation:none}.check-path{animation:none;stroke-dashoffset:0}.lift{transition:none}}
</style>
</helmet>
<div data-theme="myshop" class="min-h-[800px] flex flex-col bg-base-200 text-base-content" style="font-family: 'IBM Plex Sans Thai', 'IBM Plex Sans', sans-serif; font-variant-numeric: tabular-nums">
<main class="flex-1 flex items-center justify-center p-6">
<div class="card bg-base-100 border border-base-300 w-full max-w-[420px] anim-in">
<div class="card-body p-8 gap-5 items-stretch">
<div class="flex justify-between items-baseline">
<span class="text-2xl font-semibold">My Shop</span>
<span class="text-sm opacity-70">เครื่อง T01 · 08:00</span>
</div>

<div class="flex flex-col items-center gap-3 py-2">
<span class="text-sm font-medium">กดรหัสพนักงาน 6 หลัก</span>
<div class="flex gap-3" aria-label="{{dotsLabel}}">
<sc-for list="{{dots}}" as="d" hint-placeholder-count="6">
<span class="{{d.cls}}"></span>
</sc-for>
</div>
<div class="h-8 flex items-center">
<sc-if value="{{found}}" hint-placeholder-val="{{ false }}">
<span class="anim-pop flex items-center gap-2 rounded-full bg-secondary text-secondary-content px-3 py-1 text-sm font-medium">
<span class="bg-primary text-primary-content w-6 h-6 rounded-full grid place-items-center text-xs">สช</span>สมชาย · แคชเชียร์</span>
</sc-if>
<sc-if value="{{wrong}}" hint-placeholder-val="{{ false }}">
<span class="anim-in text-sm text-error font-medium">ไม่พบรหัสนี้ ลองใหม่อีกครั้ง</span>
</sc-if>
</div>
</div>

<div class="grid grid-cols-3 gap-2">
<sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
<button type="button" onClick="{{k.press}}" class="btn btn-ghost bg-base-200 h-16 text-2xl font-medium lift">{{k.label}}</button>
</sc-for>
</div>
<a href="OpenShift.dc.html" class="{{enterCls}}">เข้าสู่ระบบ</a>
<span class="text-xs opacity-70 text-center">ลองกด 100123</span>
</div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":800}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { code: '100' }; }
  renderVals() {
    var self = this, code = this.state.code, full = code.length === 6;
    var found = full && code === '100123', wrong = full && !found;
    var press = function (l) {
      var c = self.state.code;
      if (l === 'ล้าง') { c = ''; } else if (l === 'ลบ') { c = c.slice(0, -1); } else if (c.length < 6) { c = c + l; } else { c = l; }
      self.setState({ code: c });
    };
    return {
      dots: [0, 1, 2, 3, 4, 5].map(function (i) { return { cls: i < code.length ? (wrong ? 'w-4 h-4 rounded-full bg-error' : 'w-4 h-4 rounded-full bg-primary') : 'w-4 h-4 rounded-full border-2 border-base-300' }; }),
      dotsLabel: 'กดแล้ว ' + code.length + ' จาก 6 หลัก',
      found: found, wrong: wrong,
      enterCls: found ? 'btn btn-primary btn-lg h-14' : 'btn btn-primary btn-lg h-14 btn-disabled pointer-events-none',
      keys: ['1','2','3','4','5','6','7','8','9','ล้าง','0','ลบ'].map(function (l) { return { label: l, press: function () { press(l); } }; })
    };
  }
}
</script>
</body>
</html>
